<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be the Cell</title>
<meta name="description" content="A bacterium you run by switching its genes on and off.">
<meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Be the Cell">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f6f5f0'/%3E%3Crect x='8' y='20' width='48' height='24' rx='12' fill='%23fbf3e6' stroke='%238a7f6a' stroke-width='3'/%3E%3Cpath d='M16 32q4-5 8 0t8 0 8 0' fill='none' stroke='%233388dd' stroke-width='3'/%3E%3Ccircle cx='46' cy='30' r='3' fill='%23005533'/%3E%3C/svg%3E">
<style>
/* Colour tokens are written by btc-palette.js (one source); type, shape and space live here (LAB_UI §8.1). */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-base: 16px; --fs-small: 13px; --fs-min: 12px; --lh: 1.45;
  --radius-panel: 12px; --radius-ctl: 10px; --tap: 48px; --tap-min: 44px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: var(--fs-base)/var(--lh) var(--font);
  overflow: hidden; overscroll-behavior: none;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; font-size: 16px; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
h2, h3, p, figure { margin: 0; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sym { font-style: italic; color: var(--muted); font-weight: 400; font-size: 14px; }

/* ---- page grid per layout class (LAB_UI §1.1); the page itself never scrolls ---- */
#app {
  display: grid; height: 100vh; height: 100dvh; width: 100%;
  padding-left: var(--safe-l); padding-right: var(--safe-r);
}
#status { grid-area: status; }
#hud { grid-area: hud; height: 0; overflow: hidden; }
#stage-wrap { grid-area: stage; }
#narrator { grid-area: narr; }
#paneltabs { grid-area: ptabs; }
.pane { grid-area: content; }
#tabbar { grid-area: tabbar; }

body[data-layout="compact"] #app {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto 0 minmax(0, 1fr) auto auto;
  grid-template-areas: "status" "hud" "content" "narr" "tabbar";
}
body[data-layout="compact"] #stage-wrap { grid-area: content; }
body[data-layout="compact"] #paneltabs { display: none; }

body[data-layout="stack"] #app {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto 0 minmax(0, 42fr) auto auto minmax(0, 58fr);
  grid-template-areas: "status" "hud" "stage" "narr" "ptabs" "content";
}
body[data-layout="split"] #app {
  grid-template-columns: minmax(0, 55fr) minmax(0, 45fr);
  grid-template-rows: auto 0 auto minmax(0, 1fr) auto;
  grid-template-areas: "status status" "hud hud" "stage ptabs" "stage content" "narr content";
}
body[data-layout="wide"] #app {
  grid-template-columns: minmax(0, 1fr) 380px;
  grid-template-rows: auto 0 auto minmax(0, 55fr) auto minmax(0, 45fr);
  grid-template-areas: "status status" "hud hud" "stage ptabs" "stage content" "narr content" "graphs content";
}
body[data-layout="wide"] #pane-graphs { grid-area: graphs; }
body:not([data-layout="compact"]) #tabbar { display: none; }
body:not([data-layout="compact"]) .fb-row2 { display: none; }

/* ---- status strip (LAB_UI §6) ---- */
.status {
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: calc(3px + var(--safe-t)) 12px 3px;
  display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; grid-template-rows: 46px 24px;
  column-gap: 10px; align-items: center;
}
.play {
  width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: var(--accent-ink);
}
.play.is-running { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.play-icon { width: 14px; height: 16px; background: currentColor; clip-path: polygon(10% 0, 100% 50%, 10% 100%); margin-left: 3px; }
.play.is-running .play-icon { clip-path: none; width: 5px; margin-left: -8px; box-shadow: 8px 0 0 currentColor; }
.play-word { display: none; font-weight: 600; font-size: 15px; }
.st-time { min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.st-clock { font-size: 17px; font-weight: 600; white-space: nowrap; }
.st-gen { font-size: 13px; color: var(--muted); white-space: nowrap; }
.st-t, .st-sep { display: none; }
.st-t { margin-right: 4px; }
.st-sep { margin: 0 6px; }
.speed-chip {
  min-height: 44px; border: 1px solid var(--line); border-radius: var(--radius-ctl); background: var(--bg);
  padding: 3px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2;
}
.sp-main { font-weight: 600; font-size: 15px; white-space: nowrap; }
.sp-sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.st-row2 { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12.5px; min-width: 0; }
body[data-layout="compact"] .gauge { width: 56px; }
.st-atp, .st-growth { display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.st-growth { margin-left: auto; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.atp-label { font-weight: 600; }
.gauge { width: 64px; height: 8px; border-radius: 4px; background: var(--muted-fill); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.gauge-fill { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--good); }
.gauge-fill.is-low { background: var(--warn); }
.gauge-fill.is-depleted { background: var(--bad); }
.atp-word { color: var(--muted); }
.st-limit { color: var(--warn-ink); font-weight: 600; }

body:not([data-layout="compact"]) .status { display: flex; column-gap: 14px; min-height: 56px; }
body:not([data-layout="compact"]) .st-row2 { display: contents; }
body:not([data-layout="compact"]) .st-time { flex-direction: row; align-items: baseline; gap: 0; }
body:not([data-layout="compact"]) .st-sep { display: inline; color: var(--muted); }
body:not([data-layout="compact"]) .st-gen { font-size: 15px; }
body:not([data-layout="compact"]) .speed-chip { flex-direction: row; gap: 6px; }
body:not([data-layout="compact"]) .sp-sub::before { content: "· "; }
body[data-layout="split"] .sp-sub, body[data-layout="stack"] .sp-sub { display: none; }
body[data-layout="wide"] .st-t { display: inline; color: var(--muted); }
body[data-layout="wide"] .play, body[data-layout="stack"] .play { width: auto; border-radius: 24px; padding: 0 16px 0 14px; }
body[data-layout="wide"] .play-word, body[data-layout="stack"] .play-word { display: inline; }
body[data-layout="stack"] .st-growth { margin-left: auto; }
body[data-layout="wide"] .st-growth, body[data-layout="wide"] .st-atp { font-size: 15px; }

/* ---- cell view (LAB_UI §2) ---- */
#stage-wrap { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: var(--outside); }
body[data-layout="compact"] .stage { min-height: 220px; }
#cell-canvas { position: absolute; inset: 0; display: block; touch-action: manipulation; }
.badges { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.drug-badge { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid; }
.drug-badge.rif { color: var(--drug-rif); background: var(--drug-rif-pale); }
.drug-badge.cm { color: var(--drug-cm); background: var(--drug-cm-pale); }
.paused-badge {
  position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 96px);
  font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink); pointer-events: none;
}
.scalebar { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: flex-end; gap: 6px; pointer-events: none; font-size: 12px; color: var(--muted); }
.scalebar .label { padding: 0 4px; border-radius: 4px; background: var(--outside); }
.scalebar .bar { display: block; width: var(--len, 50px); height: 3px; background: var(--ink); border-radius: 2px; opacity: .7; }
.scalebar.is-vertical .bar { width: 3px; height: var(--len, 50px); order: 2; }
.tap-chip {
  position: absolute; z-index: 2; max-width: 260px; pointer-events: none;
  background: var(--ink); color: var(--panel); font-size: 13px; line-height: 1.3; padding: 5px 9px; border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
}

.focusbar { border-top: 1px solid var(--line); background: var(--panel); }
.fb-row1 {
  width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px;
  padding: 3px 12px; border: 0; background: none; text-align: left;
}
.gene-chip { flex: none; width: 10px; height: 26px; border-radius: 3px; }
.fb-text { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.2; }
.fb-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-title .sym { font-size: 13px; }
.fb-counts { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-change { flex: none; font-size: 13px; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 2px; }
.chev { font-size: 20px; line-height: 1; }
.fb-row2 { padding: 0 12px 4px; }
body:not([data-layout="compact"]) .fb-row1 { border-bottom: 0; }

.legend {
  width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px;
  padding: 3px 12px; border: 0; border-top: 1px solid var(--line); background: var(--panel); text-align: left;
  font-size: 13px; line-height: 1.3; color: var(--muted);
}
.legend-full { flex: 1; min-width: 0; }
.legend-short { display: none; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body[data-short] .legend-full { display: none; }
body[data-short] .legend-short { display: block; }
.key-pill { flex: none; font-weight: 600; color: var(--accent); border: 1px solid var(--line); border-radius: 14px; padding: 2px 12px; font-size: 13px; }

/* ---- narrator (LAB_UI §7.4) ---- */
.narrator {
  min-height: 52px; padding: 6px 12px 6px 12px; background: var(--panel);
  border-top: 1px solid var(--line); border-left: 4px solid var(--accent);
  font-size: 15px; line-height: 1.35; color: var(--ink);
  display: flex; align-items: center;
}
/* Compact reserves three lines (the longest sentences wrap to three at 360 px), so the page does not jump. */
body[data-layout="compact"] .narrator { min-height: 70px; line-height: 1.3; }
body[data-layout="compact"][data-short] .narrator { min-height: 52px; font-size: 14px; }
body[data-layout="split"] .narrator, body[data-layout="wide"] .narrator, body[data-layout="stack"] .narrator { border-bottom: 1px solid var(--line); }

/* ---- tabs ---- */
.tabbar {
  display: flex; background: var(--panel); border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b); height: calc(56px + var(--safe-b));
}
.tab {
  flex: 1; min-width: 0; border: 0; background: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; font-weight: 600; position: relative;
}
.tab svg { width: 24px; height: 24px; }
.tab.is-on { color: var(--accent); }
.tab.is-on::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.paneltabs { display: flex; gap: 4px; padding: 6px 12px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
.ptab {
  min-height: 44px; min-width: 88px; padding: 0 16px; border: 0; background: none; color: var(--muted);
  font-weight: 600; font-size: 15px; border-bottom: 3px solid transparent;
}
.ptab.is-on { color: var(--ink); border-bottom-color: var(--accent); }
body[data-layout="split"] .paneltabs, body[data-layout="wide"] .paneltabs { border-left: 1px solid var(--line); }
body[data-layout="split"] .pane, body[data-layout="wide"] #pane-genes, body[data-layout="wide"] #pane-medium { border-left: 1px solid var(--line); }

/* ---- panes ---- */
.pane {
  min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 12px 12px 20px; background: var(--bg); position: relative;
}
body[data-layout="wide"] #pane-graphs { border-top: 1px solid var(--line); padding-top: 10px; }
.pane-head { display: flex; align-items: baseline; gap: 8px; margin: 2px 2px 10px; }
.pane-head h2 { font-size: 18px; font-weight: 650; }
.pane-note { color: var(--muted); font-size: 13px; }
.pane-foot { color: var(--muted); font-size: 13px; margin: 2px 2px 0; }

/* ---- segmented control (LAB_UI §3.4) ---- */
.seg-group { display: flex; border: 1px solid var(--line); border-radius: var(--radius-ctl); background: var(--panel); overflow: hidden; }
.seg {
  flex: 1 1 0; min-width: 44px; min-height: 48px; padding: 2px 4px; border: 0; background: none; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15;
  position: relative; font-weight: 600;
}
.seg + .seg { box-shadow: inset 1px 0 0 var(--line); }
.seg-sub { font-size: 12px; font-weight: 400; color: var(--muted); }
.seg.is-on { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.seg.is-on .seg-sub { color: var(--accent-ink); opacity: .85; }
.seg.is-pending { background: var(--accent-pale); outline: 2px dotted var(--accent); outline-offset: -5px; }
.seg.is-default::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 12px; margin-left: -6px; height: 2px; border-radius: 1px; background: currentColor; opacity: .45; }
.seg:focus-visible { outline-offset: -4px; }
.seg-group.small .seg { min-height: 44px; font-size: 14px; }
.seg-note { font-size: 13px; color: var(--warn-ink); margin-top: 4px; }

/* ---- gene cards (LAB_UI §3.1) ---- */
.card-list { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
body[data-layout="stack"] .card-list { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.gene-card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 8px 12px 6px; }
.gene-card.is-focus { box-shadow: inset 3px 0 0 var(--accent); }
.card-head {
  width: 100%; min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 0; border: 0; background: none; text-align: left;
}
.card-chip { flex: none; width: 12px; height: 28px; border-radius: 3px; }
.card-title { flex: 1 1 0; min-width: 0; line-height: 1.2; }
.card-name { font-size: 17px; font-weight: 600; }
.state-chip { display: inline-block; font-size: 13px; line-height: 1.2; padding: 1px 8px; margin-right: 2px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.st-waiting { border-color: var(--accent); color: var(--accent); }
.st-transcribing { border-color: var(--accent-pale); background: var(--accent-pale); color: var(--ink); }
.st-stalled { border-color: var(--warn-pale); background: var(--warn-pale); color: var(--warn-ink); }
.st-leftover-mRNA, .st-protein-only { background: var(--muted-fill); border-color: var(--muted-fill); }
.st-knocked-out { border-color: var(--bad); color: var(--bad); }
.card-job { font-size: 14px; color: var(--muted); margin: 0 0 8px 22px; line-height: 1.35; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; color: var(--ink); background: var(--muted-fill); border-radius: 6px; padding: 0 6px; margin-right: 2px; }
.card-counts { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 14px; white-space: nowrap; }
.count-p { font-weight: 600; }
.spark { width: 88px; height: 28px; margin-left: auto; flex: none; }
.card-cost { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-height: 44px; }
.share-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--muted-fill); overflow: hidden; min-width: 40px; }
.share-fill { display: block; height: 100%; width: 0; background: var(--muted); border-radius: 3px; }
.share-pct { min-width: 3.2em; text-align: right; color: var(--ink); }
.btn.small-btn { min-height: 44px; min-width: 64px; padding: 0 4px 0 10px; font-size: 14px; border-color: transparent; background: none; color: var(--accent); }
.about-btn::after { content: " ▾"; }
.about-btn[aria-expanded="true"]::after { content: " ▴"; }
.card-about { font-size: 14px; color: var(--ink); margin: 0 0 8px; padding: 8px 10px; background: var(--bg); border-radius: 8px; }

/* ---- buttons, medium, actions ---- */
.btn {
  min-height: 48px; padding: 0 16px; border: 1px solid var(--line); border-radius: var(--radius-ctl);
  background: var(--panel); color: var(--ink); font-weight: 600;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.icon-btn { width: 44px; min-height: 44px; padding: 0; font-size: 18px; border-color: transparent; background: none; }
.ctl-list { display: flex; flex-direction: column; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 12px; margin-bottom: 18px; }
.ctl-row { display: flex; flex-direction: column; gap: 6px; }
.ctl-label { font-weight: 600; font-size: 15px; }
.ctl-label.inline { font-size: 14px; color: var(--muted); font-weight: 600; flex: none; }
.ctl-desc { font-size: 13px; color: var(--muted); line-height: 1.35; }
.drug-row { padding: 8px; margin: -8px; border-radius: 10px; border-left: 4px solid transparent; }
.drug-row[data-drug="rifampicin"].is-on { background: var(--drug-rif-pale); border-left-color: var(--drug-rif); }
.drug-row[data-drug="chloramphenicol"].is-on { background: var(--drug-cm-pale); border-left-color: var(--drug-cm); }
.actions { display: flex; flex-direction: column; gap: 10px; }
.build-line { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }

/* ---- graphs (LAB_UI §5) ---- */
.graph-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid var(--line);
  background: var(--panel); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted);
}
.chip.is-on { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.chip-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sym-plain { font-style: italic; }
.window-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.window-row .seg-group { flex: 1; min-width: 220px; }
body[data-layout="wide"] .graph-controls { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
body[data-layout="wide"] .window-row .seg-group { flex: 0 0 auto; min-width: 0; }
body[data-layout="wide"] .window-row .seg { min-width: 64px; padding: 0 10px; white-space: nowrap; }
.swap-ctrl { flex: 0 0 auto !important; min-width: 160px !important; }
.plot-grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
body[data-layout="stack"] .plot-grid, body[data-layout="wide"] .plot-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.plot { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 6px 10px 8px; }
.plot-head { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.plot-titles { flex: 1; min-width: 0; line-height: 1.25; }
.plot-title { font-weight: 600; font-size: 14px; margin-right: 6px; }
.plot-value { font-size: 13px; color: var(--muted); }
.lin-log { flex: none; }
.lin-log .seg { min-width: 48px; }
.plot-canvas-wrap { height: 120px; position: relative; }
body[data-layout="wide"] .plot-canvas-wrap { height: 130px; }
.plot-canvas-wrap.big { height: min(60vh, 420px); }
.plot-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.plot.spend { margin-top: 12px; }
.spend-bar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; margin: 2px 0 8px; }
.spend-seg { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; }
.spend-seg:nth-child(-n+2) .spend-in { color: var(--panel); }
.spend-in { font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.hatch { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .22) 0 3px, transparent 3px 7px); }
.spend-small { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink); }
.spend-item { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px var(--line); }
.spend-empty { font-size: 13px; color: var(--muted); padding: 6px 0; }

/* ---- sheets, toast, banner (LAB_UI §8.3) ---- */
.sheet-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(15, 18, 24, .42); display: flex; align-items: center; justify-content: center; }
.sheet {
  background: var(--panel); color: var(--ink); width: min(560px, 94vw); max-height: 86vh; max-height: 86dvh;
  border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
body[data-layout="compact"] .sheet-backdrop { align-items: flex-end; }
body[data-layout="compact"] .sheet { width: 100%; border-radius: 16px 16px 0 0; padding-bottom: var(--safe-b); }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; font-size: 18px; font-weight: 650; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.sheet-body h3 { font-size: 15px; margin: 6px 0 0; }
.sheet-body p, .sheet-body li { font-size: 15px; }
.sheet-note { color: var(--muted); font-size: 14px !important; }
.row-btn { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; text-align: left; font-weight: 500; }
.row-btn.is-current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.picker-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.picker-name { font-weight: 600; }
.picker-state { font-size: 13px; color: var(--muted); }
.picker-state .sym { font-size: 13px; }
.speed-row { min-height: 52px; }
.speed-check { width: 18px; color: var(--accent); font-weight: 700; }
.speed-label { font-weight: 600; min-width: 108px; }
.speed-gloss { flex: 1; color: var(--muted); font-size: 14px; }
.speed-key { color: var(--muted); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.big-choice { flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 16px; min-height: 64px; }
.choice-title { font-weight: 650; }
.choice-note { font-weight: 400; font-size: 14px; color: var(--muted); }
.about-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.key-list, .key-notes { list-style: none; margin: 0; padding: 0; }
.key-row { display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 15px; }
.key-glyph { width: 24px; height: 24px; border-radius: 4px; flex: none; }
.key-label { flex: 1; }
.key-n { color: var(--muted); font-size: 13px; white-space: nowrap; }
.key-notes { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.key-notes li { font-size: 14px; color: var(--muted); }
.plot-sheet .sheet { width: min(900px, 96vw); }
.toast {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(24px + var(--safe-b));
  width: max-content; max-width: min(92vw, 480px); display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--panel); padding: 8px 8px 8px 14px; border-radius: 10px; font-size: 14px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
}
body[data-layout="compact"] .toast { bottom: auto; top: calc(88px + var(--safe-t)); }
.toast-action { min-height: 44px; white-space: nowrap; flex: none; background: transparent; color: inherit; border-color: currentColor; }
.banner {
  position: fixed; z-index: 30; top: calc(8px + var(--safe-t)); left: 8px; right: 8px; margin: 0 auto; max-width: 560px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 14px; font-size: 14px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .15);
}
.banner-text { flex: 1 1 200px; }

@media (hover: hover) {
  .btn:hover, .chip:hover, .speed-chip:hover { border-color: var(--muted); }
}
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; animation: none !important; } }
body[data-reduced-motion] * { transition-duration: 0s !important; animation: none !important; }
