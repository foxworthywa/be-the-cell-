<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Be the Cell</title>
<meta name="description" content="A game about genes and proteins, in which you are in charge of a cell. In principle.">
<meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Be the Cell">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f6f5f0'/%3E%3Crect x='8' y='20' width='48' height='24' rx='12' fill='%23fbf3e6' stroke='%238a7f6a' stroke-width='3'/%3E%3Cpath d='M16 32q4-5 8 0t8 0 8 0' fill='none' stroke='%233388dd' stroke-width='3'/%3E%3Ccircle cx='46' cy='30' r='3' fill='%23005533'/%3E%3C/svg%3E">
<style>
/* Colour tokens are written by btc-palette.js (one source); type, shape and space live here (LAB_UI §8.1). */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-base: 16px; --fs-small: 13px; --fs-min: 12px; --lh: 1.45;
  --radius-panel: 12px; --radius-ctl: 10px; --tap: 48px; --tap-min: 44px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: var(--fs-base)/var(--lh) var(--font);
  overflow: hidden; overscroll-behavior: none;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; font-size: 16px; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
h2, h3, p, figure { margin: 0; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sym { font-style: italic; color: var(--muted); font-weight: 400; font-size: 14px; }

/* ---- page grid per layout class (LAB_UI §1.1); the page itself never scrolls ---- */
#app {
  display: grid; height: 100vh; height: 100dvh; width: 100%;
  padding-left: var(--safe-l); padding-right: var(--safe-r);
}
#status { grid-area: status; }
#hud { grid-area: hud; height: 0; overflow: hidden; }
body[data-hud] #hud { height: 44px; border-bottom: 1px solid var(--line); background: var(--panel); }
/* Short phone screens in a level (375 × 553): the HUD's 44 px come out of the focus bar's promoter row, which
   stays on the Genes tab, so the canvas keeps its 220 px and every target its 44 px (LEVELS §5.5.2, LV-9). */
body[data-layout="compact"][data-short][data-hud] .fb-row2 { display: none; }
#stage-wrap { grid-area: stage; }
#narrator { grid-area: narr; }
#paneltabs { grid-area: ptabs; }
.pane { grid-area: content; }
#tabbar { grid-area: tabbar; }

body[data-layout="compact"] #app {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto auto;
  grid-template-areas: "status" "hud" "content" "narr" "tabbar";
}
body[data-layout="compact"] #stage-wrap { grid-area: content; }
body[data-layout="compact"] #paneltabs { display: none; }

body[data-layout="stack"] #app {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 42fr) auto auto minmax(0, 58fr);
  grid-template-areas: "status" "hud" "stage" "narr" "ptabs" "content";
}
body[data-layout="split"] #app {
  grid-template-columns: minmax(0, 55fr) minmax(0, 45fr);
  grid-template-rows: auto auto auto minmax(0, 1fr) auto;
  grid-template-areas: "status status" "hud hud" "stage ptabs" "stage content" "narr content";
}
body[data-layout="wide"] #app {
  grid-template-columns: minmax(0, 1fr) 380px;
  grid-template-rows: auto auto auto minmax(0, 55fr) auto minmax(0, 45fr);
  grid-template-areas: "status status" "hud hud" "stage ptabs" "stage content" "narr content" "graphs content";
}
body[data-layout="wide"] #pane-graphs { grid-area: graphs; }
body:not([data-layout="compact"]) #tabbar { display: none; }
/* The Prologue's live scenes show the cell alone (labConfig.tabs = ['cell']). */
body[data-cellonly] #tabbar { display: none; }
body[data-cellonly]:not([data-layout="compact"]) #app {
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "status" "hud" "stage" "narr";
}
body[data-cellonly]:not([data-layout="compact"]) #paneltabs, body[data-cellonly]:not([data-layout="compact"]) .pane { display: none; }
body:not([data-layout="compact"]) .fb-row2 { display: none; }

/* ---- status strip (LAB_UI §6) ---- */
.status {
  background: var(--panel); border-bottom: 1px solid var(--line);
  padding: calc(3px + var(--safe-t)) 12px 3px;
  display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; grid-template-rows: 46px 24px;
  column-gap: 10px; align-items: center;
}
.play {
  width: 46px; height: 46px; border-radius: 50%; border: 0; padding: 0;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: var(--accent-ink);
}
.play.is-running { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.play-icon { width: 14px; height: 16px; background: currentColor; clip-path: polygon(10% 0, 100% 50%, 10% 100%); margin-left: 3px; }
.play.is-running .play-icon { clip-path: none; width: 5px; margin-left: -8px; box-shadow: 8px 0 0 currentColor; }
.play-word { display: none; font-weight: 600; font-size: 15px; }
.st-time { min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.st-clock { font-size: 17px; font-weight: 600; white-space: nowrap; }
.st-gen { font-size: 13px; color: var(--muted); white-space: nowrap; }
.st-t, .st-sep { display: none; }
.st-t { margin-right: 4px; }
.st-sep { margin: 0 6px; }
.speed-chip {
  min-height: 44px; border: 1px solid var(--line); border-radius: var(--radius-ctl); background: var(--bg);
  padding: 3px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2;
}
.sp-main { font-weight: 600; font-size: 15px; white-space: nowrap; }
.sp-sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.st-row2 { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12.5px; min-width: 0; }
body[data-layout="compact"] .gauge { width: 56px; }
.st-atp, .st-growth { display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.st-growth { margin-left: auto; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.atp-label { font-weight: 600; }
.gauge { width: 64px; height: 8px; border-radius: 4px; background: var(--muted-fill); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.gauge-fill { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--good); }
.gauge-fill.is-low { background: var(--warn); }
.gauge-fill.is-depleted { background: var(--bad); }
.atp-word { color: var(--muted); }
.st-limit { color: var(--warn-ink); font-weight: 600; }

body:not([data-layout="compact"]) .status { display: flex; column-gap: 14px; min-height: 56px; }
/* Levels: the Levels button at the left end of the status strip; the level title in wide (LEVELS §4.5). */
.status.has-levels { grid-template-columns: 44px 46px minmax(0, 1fr) auto; column-gap: 8px; }
body[data-layout="compact"] .status.has-levels .speed-chip { padding: 3px 8px; }
body[data-layout="compact"] .status.has-levels .st-clock.is-long { font-size: 14px; }
.btn.levels-btn {
  min-width: 44px; min-height: 44px; padding: 0 2px; border-color: transparent; background: none; color: var(--ink);
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; line-height: 1;
}
.levels-icon { width: 18px; height: 14px; display: block; background: linear-gradient(currentColor, currentColor) 0 0 / 5px 5px no-repeat,
  linear-gradient(currentColor, currentColor) 0 9px / 5px 5px no-repeat, linear-gradient(currentColor, currentColor) 7px 1px / 11px 3px no-repeat,
  linear-gradient(currentColor, currentColor) 7px 10px / 11px 3px no-repeat; }
.st-level-title { display: none; font-weight: 650; font-size: 15px; min-width: 0; max-width: 32vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body[data-layout="wide"] .st-level-title:not([hidden]) { display: inline; }
.play:disabled { opacity: .45; cursor: default; }
body:not([data-layout="compact"]) .st-row2 { display: contents; }
body:not([data-layout="compact"]) .st-time { flex-direction: row; align-items: baseline; gap: 0; }
body:not([data-layout="compact"]) .st-sep { display: inline; color: var(--muted); }
body:not([data-layout="compact"]) .st-gen { font-size: 15px; }
body:not([data-layout="compact"]) .speed-chip { flex-direction: row; gap: 6px; }
body:not([data-layout="compact"]) .sp-sub::before { content: "· "; }
body[data-layout="split"] .sp-sub, body[data-layout="stack"] .sp-sub { display: none; }
body[data-layout="wide"] .st-t { display: inline; color: var(--muted); }
body[data-layout="wide"] .play, body[data-layout="stack"] .play { width: auto; border-radius: 24px; padding: 0 16px 0 14px; }
body[data-layout="wide"] .play-word, body[data-layout="stack"] .play-word { display: inline; }
body[data-layout="stack"] .st-growth { margin-left: auto; }
body[data-layout="wide"] .st-growth, body[data-layout="wide"] .st-atp { font-size: 15px; }

/* ---- cell view (LAB_UI §2) ---- */
#stage-wrap { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: var(--outside); }
body[data-layout="compact"] .stage { min-height: 220px; }
#cell-canvas { position: absolute; inset: 0; display: block; touch-action: manipulation; }
.badges { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.drug-badge { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid; }
.drug-badge.rif { color: var(--drug-rif); background: var(--drug-rif-pale); }
.drug-badge.cm { color: var(--drug-cm); background: var(--drug-cm-pale); }
.outside-scale {
  position: absolute; top: 8px; right: 8px; pointer-events: none; font-size: 12px; color: var(--muted);
  padding: 1px 6px; border-radius: 6px; background: var(--outside);
}
.paused-badge {
  position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 96px);
  font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink); pointer-events: none;
}
.scalebar { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: flex-end; gap: 6px; pointer-events: none; font-size: 12px; color: var(--muted); }
.scalebar .label { padding: 0 4px; border-radius: 4px; background: var(--outside); }
.scalebar .bar { display: block; width: var(--len, 50px); height: 3px; background: var(--ink); border-radius: 2px; opacity: .7; }
.scalebar.is-vertical .bar { width: 3px; height: var(--len, 50px); order: 2; }
.tap-chip {
  position: absolute; z-index: 2; max-width: 260px; pointer-events: none;
  background: var(--ink); color: var(--panel); font-size: 13px; line-height: 1.3; padding: 5px 9px; border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
}

.focusbar { border-top: 1px solid var(--line); background: var(--panel); }
.fb-row1 {
  width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px;
  padding: 3px 12px; border: 0; background: none; text-align: left;
}
.gene-chip { flex: none; width: 10px; height: 26px; border-radius: 3px; }
.fb-text { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.2; }
.fb-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-title .sym { font-size: 13px; }
.fb-counts { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; column-gap: 12px; min-width: 0; }
.fb-m, .fb-p { white-space: nowrap; }
/* Phone portrait: mRNA and protein on their own lines, so the focus bar's height never changes with the counts. */
body[data-layout="compact"]:not([data-short]) .fb-counts { flex-direction: column; }
.fb-change { flex: none; font-size: 13px; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 2px; }
.chev { font-size: 20px; line-height: 1; }
/* Short screens: the chevron alone, so the counts fit on one line and the cell view keeps its 220 px. */
body[data-short] .fb-change-word { display: none; }
.fb-row2 { padding: 0 12px 4px; }
body:not([data-layout="compact"]) .fb-row1 { border-bottom: 0; }

.legend {
  width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px;
  padding: 3px 12px; border: 0; border-top: 1px solid var(--line); background: var(--panel); text-align: left;
  font-size: 13px; line-height: 1.3; color: var(--muted);
}
.legend-full { flex: 1; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; max-height: 2.6em; }
.legend-short { display: none; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body[data-short] .legend-full { display: none; }
body[data-short] .legend-short { display: block; }
.key-pill { flex: none; font-weight: 600; color: var(--accent); border: 1px solid var(--line); border-radius: 14px; padding: 2px 12px; font-size: 13px; }

/* ---- narrator (LAB_UI §7.4) ---- */
.narrator {
  min-height: 52px; padding: 6px 12px 6px 12px; background: var(--panel);
  border-top: 1px solid var(--line); border-left: 4px solid var(--accent);
  font-size: 15px; line-height: 1.35; color: var(--ink);
  display: flex; align-items: center;
}
.narrator-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
/* Compact has a fixed height of three lines (the longest sentences wrap to three at 360 px), so a new
   sentence never resizes the cell view. Short screens keep three lines at a smaller size. */
body[data-layout="compact"] .narrator { height: 72px; min-height: 0; line-height: 1.3; }
body[data-layout="compact"][data-short] .narrator { height: 54px; padding-top: 3px; padding-bottom: 3px; font-size: 13px; line-height: 1.2; }
/* Outside the phone-portrait layout the bottom cells reach into the home-indicator inset. */
body:not([data-layout="compact"]) .narrator { padding-bottom: calc(6px + var(--safe-b)); }
body[data-layout="split"] .narrator, body[data-layout="wide"] .narrator, body[data-layout="stack"] .narrator { border-bottom: 1px solid var(--line); }

/* ---- tabs ---- */
.tabbar {
  display: flex; background: var(--panel); border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b); height: calc(56px + var(--safe-b));
}
.tab {
  flex: 1; min-width: 0; border: 0; background: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; font-weight: 600; position: relative;
}
.tab svg { width: 24px; height: 24px; }
.tab.is-on { color: var(--accent); }
.tab.is-on::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.paneltabs { display: flex; gap: 4px; padding: 6px 12px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
.ptab {
  min-height: 44px; min-width: 88px; padding: 0 16px; border: 0; background: none; color: var(--muted);
  font-weight: 600; font-size: 15px; border-bottom: 3px solid transparent;
}
.ptab.is-on { color: var(--ink); border-bottom-color: var(--accent); }
body[data-layout="split"] .paneltabs, body[data-layout="wide"] .paneltabs { border-left: 1px solid var(--line); }
body[data-layout="split"] .pane, body[data-layout="wide"] #pane-genes, body[data-layout="wide"] #pane-medium { border-left: 1px solid var(--line); }

/* ---- panes ---- */
.pane {
  min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 12px 12px 20px; background: var(--bg); position: relative;
}
body:not([data-layout="compact"]) .pane { padding-bottom: calc(20px + var(--safe-b)); }
body[data-layout="wide"] #pane-graphs { border-top: 1px solid var(--line); padding-top: 10px; }
.pane-head { display: flex; align-items: baseline; gap: 8px; margin: 2px 2px 10px; }
.pane-head h2 { font-size: 18px; font-weight: 650; }
.pane-note { color: var(--muted); font-size: 13px; }
.pane-foot { color: var(--muted); font-size: 13px; margin: 2px 2px 0; }

/* ---- segmented control (LAB_UI §3.4) ---- */
.seg-group { display: flex; border: 1px solid var(--line); border-radius: var(--radius-ctl); background: var(--panel); overflow: hidden; }
.seg {
  flex: 1 1 0; min-width: 44px; min-height: 48px; padding: 2px 4px; border: 0; background: none; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15;
  position: relative; font-weight: 600;
}
.seg + .seg { box-shadow: inset 1px 0 0 var(--line); }
.seg-sub { font-size: 12px; font-weight: 400; color: var(--muted); }
.seg.is-on { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.seg.is-on .seg-sub { color: var(--accent-ink); opacity: .85; }
.seg.is-pending { background: var(--accent-pale); outline: 2px dotted var(--accent); outline-offset: -5px; }
.seg.is-default::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 12px; margin-left: -6px; height: 2px; border-radius: 1px; background: currentColor; opacity: .45; }
.seg:focus-visible { outline-offset: -4px; }
.seg-group.small .seg { min-height: 44px; font-size: 14px; }
.seg-note { font-size: 13px; color: var(--warn-ink); margin-top: 4px; }

/* ---- gene cards (LAB_UI §3.1) ---- */
.card-list { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
body[data-layout="stack"] .card-list { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.gene-card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 8px 12px 6px; }
.gene-card.is-focus { box-shadow: inset 3px 0 0 var(--accent); }
.card-head {
  width: 100%; min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 0; border: 0; background: none; text-align: left;
}
.card-chip { flex: none; width: 12px; height: 28px; border-radius: 3px; }
.card-title { flex: 1 1 0; min-width: 0; line-height: 1.2; }
.card-name { font-size: 17px; font-weight: 600; }
.state-chip { display: inline-block; font-size: 13px; line-height: 1.2; padding: 1px 8px; margin-right: 2px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.st-waiting { border-color: var(--accent); color: var(--accent); }
.st-transcribing { border-color: var(--accent-pale); background: var(--accent-pale); color: var(--ink); }
.st-stalled { border-color: var(--warn-pale); background: var(--warn-pale); color: var(--warn-ink); }
.st-leftover-mRNA, .st-protein-only { background: var(--muted-fill); border-color: var(--muted-fill); }
.st-knocked-out { border-color: var(--bad); color: var(--bad); }
.card-job { font-size: 14px; color: var(--muted); margin: 0 0 8px 22px; line-height: 1.35; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; color: var(--ink); background: var(--muted-fill); border-radius: 6px; padding: 0 6px; margin-right: 2px; }
/* Counts on two lines at the left, the sparkline beside them: the same shape at any count, never past the card edge. */
.card-counts { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; margin-top: 8px; font-size: 14px; line-height: 1.3; }
.count-m, .count-p { grid-column: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count-p { font-weight: 600; }
.spark { grid-column: 2; grid-row: 1 / span 2; width: 88px; max-width: 88px; height: 28px; }
.card-cost { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-height: 44px; }
.share-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--muted-fill); overflow: hidden; min-width: 40px; }
.share-fill { display: block; height: 100%; width: 0; background: var(--muted); border-radius: 3px; }
.share-pct { min-width: 3.2em; text-align: right; color: var(--ink); }
.btn.small-btn { min-height: 44px; min-width: 64px; padding: 0 4px 0 10px; font-size: 14px; border-color: transparent; background: none; color: var(--accent); }
.about-btn::after { content: " ▾"; }
.about-btn[aria-expanded="true"]::after { content: " ▴"; }
.card-about { font-size: 14px; color: var(--ink); margin: 0 0 8px; padding: 8px 10px; background: var(--bg); border-radius: 8px; }

/* ---- buttons, medium, actions ---- */
.btn {
  min-height: 48px; padding: 0 16px; border: 1px solid var(--line); border-radius: var(--radius-ctl);
  background: var(--panel); color: var(--ink); font-weight: 600;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* A button that cannot act yet (Lock in before every Core cell is set) says so by its look. */
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { width: 44px; min-height: 44px; padding: 0; font-size: 18px; border-color: transparent; background: none; }
.ctl-list { display: flex; flex-direction: column; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 12px; margin-bottom: 18px; }
.ctl-row { display: flex; flex-direction: column; gap: 6px; }
.ctl-label { font-weight: 600; font-size: 15px; }
.ctl-label.inline { font-size: 14px; color: var(--muted); font-weight: 600; flex: none; }
.ctl-desc { font-size: 13px; color: var(--muted); line-height: 1.35; }
.drug-row { padding: 8px; margin: -8px; border-radius: 10px; border-left: 4px solid transparent; }
.drug-row[data-drug="rifampicin"].is-on { background: var(--drug-rif-pale); border-left-color: var(--drug-rif); }
.drug-row[data-drug="chloramphenicol"].is-on { background: var(--drug-cm-pale); border-left-color: var(--drug-cm); }
.actions { display: flex; flex-direction: column; gap: 10px; }
.build-line { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }

/* ---- graphs (LAB_UI §5) ---- */
.graph-controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid var(--line);
  background: var(--panel); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted);
}
.chip.is-on { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.chip-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sym-plain { font-style: italic; }
.window-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.window-row .seg-group { flex: 1; min-width: 220px; }
body[data-layout="wide"] .graph-controls { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
body[data-layout="wide"] .window-row .seg-group { flex: 0 0 auto; min-width: 0; }
body[data-layout="wide"] .window-row .seg { min-width: 64px; padding: 0 10px; white-space: nowrap; }
.swap-ctrl { flex: 0 0 auto !important; min-width: 160px !important; }
.plot-grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
body[data-layout="stack"] .plot-grid, body[data-layout="wide"] .plot-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.plot { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 6px 10px 8px; }
.plot-head { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.plot-titles { flex: 1; min-width: 0; line-height: 1.25; }
.plot-title { font-weight: 600; font-size: 14px; margin-right: 6px; }
.plot-value { font-size: 13px; color: var(--muted); }
.lin-log { flex: none; }
.lin-log .seg { min-width: 48px; }
.plot-canvas-wrap { height: 120px; position: relative; }
body[data-layout="wide"] .plot-canvas-wrap { height: 130px; }
.plot-canvas-wrap.big { height: min(60vh, 420px); }
.plot-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.plot.spend { margin-top: 12px; }
.spend-bar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; margin: 2px 0 8px; }
.spend-seg { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; }
.spend-seg:nth-child(-n+2) .spend-in { color: var(--panel); }
.spend-in { font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.hatch { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .22) 0 3px, transparent 3px 7px); }
.spend-small { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink); }
.spend-item { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px var(--line); }
.spend-empty { font-size: 13px; color: var(--muted); padding: 6px 0; }

/* ---- sheets, toast, banner (LAB_UI §8.3) ---- */
.sheet-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(15, 18, 24, .42); display: flex; align-items: center; justify-content: center; }
.sheet {
  background: var(--panel); color: var(--ink); width: min(560px, 94vw); max-height: 86vh; max-height: 86dvh;
  border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
body[data-layout="compact"] .sheet-backdrop { align-items: flex-end; }
body[data-layout="compact"] .sheet { width: 100%; border-radius: 16px 16px 0 0; padding-bottom: var(--safe-b); }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; font-size: 18px; font-weight: 650; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.sheet-body h3 { font-size: 15px; margin: 6px 0 0; }
.sheet-body p, .sheet-body li { font-size: 15px; }
.sheet-note { color: var(--muted); font-size: 14px !important; }
.row-btn { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; text-align: left; font-weight: 500; }
.row-btn.is-current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.picker-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.picker-name { font-weight: 600; }
.picker-state { font-size: 13px; color: var(--muted); }
.picker-state .sym { font-size: 13px; }
.speed-row { min-height: 52px; }
.speed-check { width: 18px; color: var(--accent); font-weight: 700; }
.speed-label { font-weight: 600; min-width: 108px; }
.speed-gloss { flex: 1; color: var(--muted); font-size: 14px; }
.speed-key { color: var(--muted); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
/* Keyboard shortcuts mean nothing on a touch phone, where the boxes read as checkboxes. */
@media (hover: none), (pointer: coarse) { .speed-key { display: none; } }
.big-choice { flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 16px; min-height: 64px; }
.choice-title { font-weight: 650; }
.choice-note { font-weight: 400; font-size: 14px; color: var(--muted); }
.about-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.key-list, .key-notes { list-style: none; margin: 0; padding: 0; }
.key-row { display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 15px; }
.key-glyph { width: 24px; height: 24px; border-radius: 4px; flex: none; }
.key-label { flex: 1; }
.key-n { color: var(--muted); font-size: 13px; white-space: nowrap; }
.key-notes { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.key-notes li { font-size: 14px; color: var(--muted); }
.plot-sheet .sheet { width: min(900px, 96vw); }
.toast {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(24px + var(--safe-b));
  width: max-content; max-width: min(92vw, 480px); display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--panel); padding: 8px 8px 8px 14px; border-radius: 10px; font-size: 14px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
}
/* Compact: above the tab bar, clear of the cell view. */
body[data-layout="compact"] .toast { bottom: calc(64px + var(--safe-b)); }
/* Home and the Prologue's drawings keep their buttons and sheets at the bottom: a toast goes to the top there. */
body[data-surface="home"] .toast, body[data-surface="prologue"] .toast { top: calc(12px + var(--safe-t)); bottom: auto; }
.toast-action { min-height: 44px; white-space: nowrap; flex: none; background: transparent; color: inherit; border-color: currentColor; }
.banner {
  position: fixed; z-index: 30; top: calc(8px + var(--safe-t)); left: 8px; right: 8px; margin: 0 auto; max-width: 560px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 14px; font-size: 14px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .15);
}
.banner-text { flex: 1 1 200px; }

/* ---- level HUD (LEVELS §5.5.2): one 44 px row ---- */
.hud-row { height: 100%; display: flex; align-items: stretch; gap: 6px; padding: 0 8px; }
.hud-chip {
  display: inline-flex; align-items: center; padding: 0 10px; border: 0; background: none; color: var(--ink);
  font-size: 14px; font-weight: 600; white-space: nowrap; min-width: 0;
}
body[data-short] .hud-chip { font-size: 13px; }
@media (max-width: 399px) { .hud-row { gap: 4px; padding: 0 6px; } .hud-chip { padding: 0 6px; font-size: 13px; } }
.hud-goal { flex: 1 1 auto; min-width: 120px; min-height: 44px; position: relative; overflow: hidden; justify-content: flex-start; border-radius: 8px; text-align: left; }
.hud-goal-text { overflow: hidden; text-overflow: ellipsis; }
.hud-goal.is-continue { background: var(--accent); color: var(--accent-ink); flex: 1 0 auto; }
.hud-goal.is-continue ~ .hud-timer { display: none; }
.hud-goal.is-continue::after { content: " ›"; margin-left: 4px; }
.hud-bar { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 4px; border-radius: 2px; background: var(--muted-fill); overflow: hidden; }
.hud-bar-fill { display: block; height: 100%; width: 0; background: var(--accent); }
.hud-timer, .hud-counter { flex: none; color: var(--muted); font-weight: 500; }
.hud-counter.is-over { color: var(--warn-ink); font-weight: 700; }

/* ---- level 1.2 sketch and 1.4 band gauge (LEVELS §5.4.3, §7.4.4) ---- */
.lv-sketch-sheet .sheet-body { gap: 8px; }
body:not([data-layout="compact"]) .sheet.lv-sketch-sheet { width: min(700px, 94vw); }
.sketch-wrap { position: relative; width: 100%; height: 260px; flex: none; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
body:not([data-layout="compact"]) .sketch-wrap { height: 320px; }
body[data-short] .sketch-wrap { height: 220px; }
.sketch-wrap.is-chart { height: 220px; }
body:not([data-layout="compact"]) .sketch-wrap.is-chart { height: 260px; }
.sketch-wrap.is-readonly { border-style: dashed; }
.sketch-canvas { display: block; width: 100%; height: 100%; }
.sketch-note { font-size: 14px !important; color: var(--muted); min-height: 1.4em; }
.sketch-note.is-warn { color: var(--warn-ink); font-weight: 600; }
.sketch-toggle { align-self: flex-start; }
.sketch-sliders { display: flex; flex-direction: column; gap: 6px; }
.sketch-slider { display: flex; align-items: center; gap: 8px; }
.sketch-at { min-width: 84px; color: var(--muted); font-size: 15px; }
.sketch-value { width: 72px; height: 44px; text-align: center; font-weight: 600; border: 1px solid var(--line); border-radius: var(--radius-ctl); background: var(--panel); color: var(--ink); font-size: 16px; }
.lv-sketch-chart { display: flex; flex-direction: column; gap: 4px; margin: 4px 0; }
.sketch-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--ink); }
.sketch-key { display: inline-flex; align-items: center; gap: 6px; }
.sketch-swatch { display: inline-block; width: 22px; height: 0; border-top: 2.5px solid var(--muted); }
.sketch-swatch.is-dashed { border-top-style: dashed; }
.lv-features { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lv-features li { display: flex; flex-wrap: wrap; gap: 0 4px; font-size: 15px; }
.lv-features .lv-feature-name { font-weight: 600; }
.lv-features .lv-feature-fb { flex-basis: 100%; padding-left: 20px; color: var(--ink); font-size: 14px; }
.lv-features .is-right .lv-mark { color: var(--good); }
.lv-features .is-wrong .lv-mark { color: var(--bad); }
.lv-actions.lv-actions-end { justify-content: flex-end; }
.hud-bar.is-gauge { height: 6px; bottom: 3px; overflow: visible; }
.hud-gauge-band { position: absolute; top: 0; bottom: 0; background: var(--good); opacity: .45; border-radius: 2px; }
.hud-gauge-tick { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 1px; }
.hud-gauge-tick.is-in { background: var(--good); }

/* ---- home and level select (LEVELS §5.1) ---- */
.home {
  position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--bg);
  padding: calc(12px + var(--safe-t)) calc(16px + var(--safe-r)) calc(24px + var(--safe-b)) calc(16px + var(--safe-l));
}
.home-wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.home-head { padding: 4px 2px 2px; }
.home-title { margin: 0; font-size: 22px; font-weight: 700; }
.home-tagline { color: var(--muted); font-size: 15px; margin-top: 2px; }
.home-continue { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 10px; text-align: left; font-size: 16px; }
.home-continue-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.level-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
body:not([data-layout="compact"]) .level-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.level-row {
  width: 100%; min-height: 72px; display: flex; flex-direction: column; justify-content: center; gap: 3px; text-align: left;
  padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-panel); background: var(--panel); color: var(--ink);
}
body:not([data-layout="compact"]) .level-row { min-height: 104px; padding: 12px 16px; }
.lr-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lr-name { flex: 1; min-width: 0; font-weight: 650; font-size: 16px; line-height: 1.25; }
.lr-chip { flex: none; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.lr-chip.st-done { border-color: var(--good); color: var(--ink); }
.lr-chip.st-open { border-color: var(--accent); color: var(--accent); }
.lr-chip.lr-expert { border-color: var(--ink); color: var(--ink); }
/* Titles and challenges wrap to a second line on a phone rather than being cut off (M2 review). */
.lr-challenge { font-size: 14px; color: var(--muted); line-height: 1.3; }
.lr-min { font-size: 13px; color: var(--muted); }
.home-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
body:not([data-layout="compact"]) .home-actions { max-width: 560px; }
.home-lab { min-height: 56px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; padding: 8px 16px; border-color: var(--accent); }
.home-row { display: flex; gap: 8px; }
.home-row .btn { flex: 1 1 0; min-width: 0; padding: 0 8px; }
.home-privacy { font-size: 13px; color: var(--muted); }
.home-export { align-self: flex-start; }
.code-row { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.code-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.code-label { font-size: 13px; color: var(--muted); min-width: 92px; }
.code-text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; flex: 1 1 200px; }
.btn.small { min-height: 44px; min-width: 64px; padding: 0 12px; font-size: 14px; }
.code-status { font-size: 13px; color: var(--muted); }
.card-tiles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.card-tile { min-height: 72px; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; padding: 8px 12px; border: 2px solid var(--muted); border-radius: 12px; background: var(--panel); }
.card-tile.stamp-universal { border-color: var(--accent); }
.card-tile-title { font-weight: 650; font-size: 16px; }
.card-stamp { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stamp-universal .card-stamp { color: var(--accent); }

/* ---- Prologue drawings (LEVELS §7.P) ---- */
.prologue { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; padding-top: var(--safe-t); }
.pl-bar { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.pl-title { font-weight: 650; font-size: 16px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* The story sheet covers the lower part: the drawing sits above it. */
.pl-stage { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 10px 16px min(48dvh, 360px); }
/* Wider screens: the drawing on the left, the story beside it, so a question never hides the picture. */
body:not([data-layout="compact"]) .pl-stage { padding: 24px calc(48px + min(520px, 44vw)) 24px 24px; align-items: center; }
body[data-surface="prologue"]:not([data-layout="compact"]) .sheet-backdrop.lv-dim { align-items: center; justify-content: flex-end; padding: 24px 24px 24px 0; }
body[data-surface="prologue"]:not([data-layout="compact"]) .lv-story { width: min(520px, 44vw); }
.pl-figure { margin: 0; width: 100%; max-width: 560px; height: 100%; display: flex; flex-direction: column; gap: 6px; }
.pl-note { align-self: flex-start; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; background: var(--panel); }
.pl-art { flex: 1; min-height: 0; display: flex; justify-content: center; transition: opacity 300ms; }
.pl-svg { width: 100%; height: 100%; }
.pl-fade .pl-art { opacity: .22; }
.pl-zoom .pl-art { animation: pl-zoom 300ms ease-out; }
@keyframes pl-zoom { from { transform: scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
.pl-l { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pl-f { fill: var(--inside); }
.pl-m { stroke: var(--muted); stroke-width: 1.5; }
.pl-a { stroke: var(--accent); stroke-width: 2.2; }
.pl-w { stroke-width: 4.5; }
.pl-n { fill: var(--nucleoid); }
.pl-k { fill: none; stroke: var(--muted); stroke-width: 1; }
.pl-sb { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: square; }
.pl-t { fill: var(--ink); font: 600 13px var(--font); }
.pl-s { fill: var(--ink); font: 12px var(--font); }

/* ---- level sheets (LEVELS §5.2–5.9) ---- */
.sheet-backdrop.lv-dim { background: rgba(15, 18, 24, .16); }
.sheet-backdrop.lv-clear { background: transparent; }
body:not([data-layout="compact"]) .sheet-backdrop.lv-dim { align-items: flex-end; padding-bottom: calc(24px + var(--safe-b)); }
.lv-story { box-shadow: 0 -4px 24px rgba(0, 0, 0, .18); }
body[data-layout="compact"] .lv-story { max-height: 50vh; max-height: 50dvh; }
body[data-layout="compact"] .lv-story.lv-tall { max-height: 86vh; max-height: 86dvh; }
.lv-full { max-height: 90vh; max-height: 90dvh; }
body[data-layout="compact"] .lv-full { height: calc(100vh - 12px - var(--safe-t)); height: calc(100dvh - 12px - var(--safe-t)); max-height: none; }
.lv-sheet .sheet-body { flex: 1 1 auto; gap: 10px; }
.lv-sheet .sheet-body h3 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.lv-speaker { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.lv-who { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lv-speaker.is-you .lv-who { color: var(--accent); }
.lv-count { font-size: 12px; color: var(--muted); }
.lv-line { font-size: 17px !important; line-height: 1.45; margin: 2px 0 6px; }
.lv-line-small { font-size: 16px !important; margin-bottom: 10px; }
.lv-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.lv-actions-start { justify-content: flex-start; }
.lv-actions .btn { min-height: 48px; }
.lv-next { min-width: 132px; }
.lv-skip { border-color: transparent; background: none; color: var(--accent); min-height: 44px; padding: 0 8px; }
.lv-wide { flex: 1 1 auto; }
.lv-sticky { position: sticky; bottom: -16px; margin-top: auto; padding: 10px 0 16px; background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.lv-sticky > .btn { min-height: 48px; }
.lv-prompt { font-size: 17px !important; font-weight: 600; line-height: 1.4; }
.lv-goal { font-size: 17px !important; }
.lv-objectives { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.lv-objectives li { padding-left: 28px; position: relative; }
.lv-objectives li::before { content: "☐"; position: absolute; left: 2px; top: -1px; color: var(--muted); font-size: 18px; }
.lv-menu { display: flex; flex-direction: column; gap: 8px; }
.lv-options { display: flex; flex-direction: column; gap: 8px; }
.lv-option {
  width: 100%; min-height: 52px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px;
  text-align: left; font-weight: 500; padding: 10px 14px; white-space: normal; line-height: 1.35;
}
.lv-option.is-selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.lv-option.is-right { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); cursor: default; }

.lv-mark { font-weight: 700; font-size: 14px; }
.is-wrong .lv-mark { color: var(--bad); }

.lv-fb { font-size: 15px; color: var(--ink); font-weight: 400; }
.lv-stepper { display: flex; align-items: center; gap: 8px; }
.lv-step { width: 48px; min-width: 48px; padding: 0; font-size: 22px; }
.lv-number { width: 110px; height: 48px; text-align: center; border: 1px solid var(--line); border-radius: var(--radius-ctl); background: var(--panel); }
.lv-unit { color: var(--muted); }
.lv-outcome { font-size: 19px !important; font-weight: 700; }

.lv-eff { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 6px; }
.lv-eff-head { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; }
.lv-eff-bar { position: relative; height: 14px; border-radius: 7px; background: var(--muted-fill); margin-top: 14px; }
.lv-eff-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: var(--warn); }

.lv-eff-par-label { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--muted); }
.lv-review { padding: 8px 12px; border-radius: 10px; background: var(--bg); border-left: 4px solid var(--muted); display: flex; flex-direction: column; gap: 4px; }
.lv-review.is-right { border-left-color: var(--good); }
.lv-review.is-wrong { border-left-color: var(--bad); }
.lv-review-q { font-size: 14px !important; color: var(--muted); }
.lv-review-a { font-weight: 600; }
.lv-echo-text { font-size: 17px !important; line-height: 1.5; }
.lv-score p { font-size: 15px; }
.lv-score .lv-total { font-size: 20px; font-weight: 700; margin-top: 4px; }
.code-caption { font-size: 13px !important; color: var(--muted); margin-top: 6px; }
.code-box {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 18px; line-height: 1.4; letter-spacing: .01em;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-ctl); background: var(--bg);
  user-select: all; -webkit-user-select: all; overflow-wrap: anywhere;
}
.code-line-part { display: block; }
.lv-copy-status { font-size: 14px !important; min-height: 1.4em; color: var(--ink); }
.lv-keep { font-size: 14px !important; font-weight: 600; }
.lv-canvas { font-size: 15px !important; font-weight: 600; }
.lv-hint { font-size: 15px !important; padding: 8px 12px; border-radius: 10px; background: var(--bg); border-left: 4px solid var(--warn); }
.sheet:focus { outline: none; }

/* ---- level 1.1: hidden names and reveals (LEVELS §5.5.1) ---- */
.card-named { font-size: 13px; color: var(--muted); margin: -4px 0 6px 22px; line-height: 1.3; }
.medium-note { color: var(--ink) !important; }
.lv-named { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.lv-named li { font-size: 15px; }

/* ---- level 1.7: HUD action, lac region, truth table, DNA editor (LEVELS §5.4.4, §5.10, §7.7.2) ---- */
.hud-goal-lines { display: flex; flex-direction: column; justify-content: center; min-width: 0; line-height: 1.2; }
.hud-goal-sub { font-size: 12px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.btn.hud-action {
  flex: none; align-self: center; min-height: 44px; min-width: 44px; padding: 0 12px; font-size: 14px; white-space: nowrap;
  border-color: var(--accent); color: var(--accent); background: var(--panel);
}
.btn.hud-action.is-running { background: var(--accent-pale); color: var(--ink); }
@media (max-width: 399px) { .btn.hud-action { padding: 0 8px; font-size: 13px; } }
.lac-inset {
  position: absolute; top: 6px; left: 6px; right: 6px; max-width: 420px; margin: 0 auto; pointer-events: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1px 4px; opacity: .94;
}
body[data-lac] .outside-scale { top: auto; bottom: 34px; }
/* On a short phone the lac panel leaves little stage: the outside scale stays in the Key sheet. */
body[data-lac][data-short] .outside-scale { display: none; }
.dz-svg { display: block; width: 100%; height: auto; }
.dz-title { font: 600 11px var(--font); fill: var(--muted); }
.dz-lab { font: 11px var(--font); fill: var(--ink); }
.dz-in { font: 700 10px var(--font); fill: var(--panel); }
.dz-lab.is-muted, .dz-in.is-muted { fill: var(--muted); }
.tt-grid { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
/* One strain per row at every width, so the drawing stays large enough to read; it stops growing at 448 px. */
.tt-card .tt-dna { max-width: 448px; }
.tt-card { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--panel); }
.tt-card.is-expert { border-style: dashed; }
.tt-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.tt-name { font-weight: 650; font-size: 15px; }
.tt-tag { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tt-dna { border-radius: 8px; background: var(--inside); padding: 0 4px; }
.tt-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); align-items: center; gap: 8px; }
.tt-col { font-size: 14px; color: var(--muted); line-height: 1.25; }
.tt-seg .seg { min-height: 48px; font-size: 14px; padding: 2px 6px; }
.tt-review { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tt-review li { display: flex; flex-direction: column; gap: 2px; }
.tt-cells { display: flex; flex-direction: column; gap: 1px; padding-left: 10px; font-size: 14px; }
.tt-cell.is-right .lv-mark { color: var(--good); }
.tt-cell.is-wrong .lv-mark { color: var(--bad); }
.lv-design .sheet-body { gap: 10px; }
body:not([data-layout="compact"]) .sheet.lv-design { width: min(760px, 94vw); }
.dz-preview { border: 1px solid var(--line); border-radius: 10px; padding: 2px 6px; background: var(--inside); }
.dz-preview .dz-svg { max-width: 460px; margin: 0 auto; }
.dz-strip { display: flex; flex-direction: column; gap: 6px; }
.dz-parts { display: flex; flex-wrap: wrap; gap: 8px; }
body:not([data-layout="compact"]) .dz-parts { flex-wrap: nowrap; }
.btn.dz-part { flex: 1 1 132px; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 6px 10px; text-align: left; font-weight: 500; }
.btn.dz-part.is-open { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.btn.dz-part:disabled { opacity: .5; cursor: default; }
.dz-part-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.dz-part-name { font-size: 13px; color: var(--muted); font-weight: 600; }
.dz-part-value { font-size: 16px; font-weight: 650; }
.dz-part.is-absent .dz-part-value { color: var(--muted); }
.dz-icon { flex: none; display: inline-block; box-sizing: border-box; }
.dz-lacI-promoter, .dz-lac-promoter { width: 14px; height: 14px; border-left: 3px solid var(--ink); border-top: 3px solid var(--ink); margin: 6px 4px 0 2px; }
.dz-lacI-allele { width: 24px; height: 14px; border-radius: 3px; background: var(--g-lacI); }
.dz-lacI-allele.is-absent { background: none; border: 2px dashed var(--muted); }
.dz-lac-crpSite { width: 13px; height: 13px; border: 2.5px solid var(--accent); transform: rotate(45deg); margin: 0 5px; }
.dz-lac-operator { width: 16px; height: 14px; border: 2.5px solid var(--ink); margin: 0 2px; }
.dz-lac-crpSite.is-absent, .dz-lac-operator.is-absent { border-style: dashed; border-color: var(--muted); }
.dz-genes { flex: 1 1 100%; display: flex; gap: 3px; min-height: 36px; align-items: stretch; }
.dz-gene { display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--panel); font-size: 13px; font-weight: 700; font-style: italic; }

.dz-options { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.dz-desc { font-size: 14px !important; line-height: 1.35; }
